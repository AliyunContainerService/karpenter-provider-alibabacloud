name: E2EMatrixTrigger
on:
  workflow_dispatch:
    inputs:
      region:
        type: string
        default: cn-hangzhou
      cleanup:
        type: boolean
        default: true
      source:
        type: choice
        default: alibabacloud
        options:
          - alibabacloud
          - upstream
          - all
      max_parallel:
        type: number
        default: 10
        description: Maximum number of E2E suite clusters to run concurrently.
permissions:
  contents: read
concurrency:
  group: e2e-matrix-trigger-${{ github.ref }}
  cancel-in-progress: false
jobs:
  matrix:
    uses: ./.github/workflows/e2e-matrix.yaml
    with:
      region: ${{ inputs.region }}
      cleanup: ${{ inputs.cleanup }}
      source: ${{ inputs.source }}
      max_parallel: ${{ inputs.max_parallel }}
    secrets:
      ALIBABA_CLOUD_E2E_CONFIG: ${{ secrets.ALIBABA_CLOUD_E2E_CONFIG }}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
