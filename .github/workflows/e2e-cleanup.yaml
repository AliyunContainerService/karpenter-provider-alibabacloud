name: E2ECleanup
on:
  workflow_dispatch:
    inputs:
      deploy_config:
        type: string
        default: deploy-config.yaml
      manifest:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: e2e-cleanup-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/e2e/cleanup
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        with:
          deploy_config: ${{ inputs.deploy_config }}
          manifest: ${{ inputs.manifest }}
