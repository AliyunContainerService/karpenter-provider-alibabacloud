name: E2EUpgrade
on:
  workflow_dispatch:
    inputs:
      region:
        type: string
        default: cn-hangzhou
      cleanup:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: e2e-upgrade-${{ github.ref }}
  cancel-in-progress: false
jobs:
  upgrade:
    uses: ./.github/workflows/e2e.yaml
    with:
      suite: Drift
      region: ${{ inputs.region }}
      cleanup: ${{ inputs.cleanup }}
      workflow_trigger: upgrade
      source: alibabacloud
    secrets:
      ALIBABA_CLOUD_E2E_CONFIG: ${{ secrets.ALIBABA_CLOUD_E2E_CONFIG }}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
