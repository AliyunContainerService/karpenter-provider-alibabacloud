name: E2EParity
on:
  pull_request:
    paths:
      - ".github/actions/e2e/**"
      - ".github/workflows/e2e*.yaml"
      - "test/hack/e2e/parity/**"
      - "test/suites/**"
      - "Makefile"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: e2e-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false
      - name: Check E2E parity
        shell: bash
        run: |
          set -euo pipefail
          make e2e-parity
