name: E2EScaleTrigger
on:
  schedule:
    - cron: "7 18 * * *"
  workflow_dispatch:
    inputs:
      region:
        required: true
        default: cn-hangzhou
        type: string
      cleanup:
        required: true
        default: true
        type: boolean
      enable_metrics:
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: e2e-scale-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scale:
    uses: ./.github/workflows/e2e.yaml
    with:
      suite: Scale
      region: ${{ inputs.region || 'cn-hangzhou' }}
      enable_metrics: ${{ inputs.enable_metrics || false }}
      workflow_trigger: scale
      source: alibabacloud
      discover_gpu: true
      cleanup: ${{ github.event_name != 'workflow_dispatch' && true || inputs.cleanup }}
    secrets:
      ALIBABA_CLOUD_E2E_CONFIG: ${{ secrets.ALIBABA_CLOUD_E2E_CONFIG }}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
