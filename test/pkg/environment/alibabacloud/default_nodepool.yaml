apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: Never
    budgets:
      - nodes: 100%
  limits:
    cpu: 1000
    memory: 1000Gi
  template:
    spec:
      expireAfter: Never
      requirements:
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["ecs.c9i.large", "ecs.c9i.xlarge"]
      nodeClassRef:
        group: karpenter.alibabacloud.com
        kind: ECSNodeClass
        name: default
